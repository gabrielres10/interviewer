spring:
  server:
    port: 8081
  application:
    name: interview
  datasource:
    url: jdbc:postgresql://localhost:5432/questions
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver # May be optional
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always